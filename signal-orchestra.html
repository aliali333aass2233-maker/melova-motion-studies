<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Signal Orchestra — MELOVA</title><link rel="stylesheet" href="assets/base.css"><style>
:root{--hot:#a987ff}.orchestra{position:absolute;right:6%;top:14%;width:min(720px,56vw);height:62%;display:grid;grid-template-columns:repeat(8,1fr);gap:7px;align-items:center;perspective:900px}.stem{position:relative;height:70%;transform-style:preserve-3d;animation:stem 8s calc(var(--i)*-.11s) cubic-bezier(.6,0,.2,1) infinite}.stem:before{content:'';position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--hot) 65%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--hot) 40%,transparent),transparent);box-shadow:inset 0 -50px 60px rgba(0,0,0,.4)}.stem:after{content:attr(data-label);position:absolute;left:50%;bottom:12px;transform:translateX(-50%) rotate(-90deg);color:#cbc6d2;font-size:6px;letter-spacing:.16em}.beat{position:absolute;inset:50% -10% auto;height:1px;background:linear-gradient(90deg,transparent,var(--hot),transparent);box-shadow:0 0 18px var(--hot);animation:scan 2s linear infinite}.count{position:absolute;right:3%;top:1%;font:700 clamp(80px,14vw,200px)/1 'Bricolage Grotesque';letter-spacing:-.1em;color:rgba(255,255,255,.025);animation:count 8s steps(4) infinite}@keyframes stem{0%,100%{height:16%;transform:rotateX(0) translateZ(0);opacity:.35}18%{height:calc(25% + var(--i)*7%);transform:rotateX(-12deg) translateZ(calc(var(--i)*3px));opacity:1}40%{height:85%;transform:rotateY(calc((var(--i) - 4)*5deg)) translateZ(80px)}65%{height:34%;transform:rotateX(18deg) translateZ(20px)}82%{height:60%;transform:rotateY(-12deg)}}@keyframes scan{from{transform:translateY(-220px)}to{transform:translateY(220px)}}@keyframes count{0%{content:'01'}25%{transform:translateY(-20px)}50%{transform:translateY(15px)}75%{transform:translateY(-8px)}}</style></head><body><nav class="top"><a class="brand" href="index.html"><span class="mark"><i></i><i></i><i></i><i></i><i></i></span>MELOVA / 03</a><div class="nav"><a href="index.html">ALL STUDIES</a><button data-pause>Pause motion</button></div></nav><main class="stage"><div class="backdrop"></div><span class="badge">8 SECOND LOOP · BEAT GRID</span><div class="orchestra"><div class="count">04</div><i class="beat"></i><div class="stem" style="--i:0" data-label="IDEA"></div><div class="stem" style="--i:1" data-label="KICK"></div><div class="stem" style="--i:2" data-label="BASS"></div><div class="stem" style="--i:3" data-label="CHORD"></div><div class="stem" style="--i:4" data-label="VOICE"></div><div class="stem" style="--i:5" data-label="AIR"></div><div class="stem" style="--i:6" data-label="SPACE"></div><div class="stem" style="--i:7" data-label="MASTER"></div></div><div class="copy"><div class="eyebrow">STUDY 03 · KINETIC STEM SYSTEM</div><h1>Every layer<br>takes the stage.</h1><p>Eight musical stems behave like a choreographed poster: entering on a beat grid, gaining depth, then resolving into one master signal.</p></div><div class="meta"><span>RHYTHM<b>4 / 4 GRID</b></span><span>SPACE<b>2D → 3D</b></span></div><i class="grain"></i></main><script src="assets/base.js"></script></body></html>
