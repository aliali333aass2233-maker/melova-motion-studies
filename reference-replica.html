<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>The Design — Controlled Motion Study</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Roboto+Condensed:wght@700&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111}button,input{font:inherit}.canvas{position:relative;width:100vw;height:100vh;min-height:720px;overflow:hidden;color:#fff;background:radial-gradient(ellipse at 50% 47%,#d7d7d5 0,#c8c8c6 43%,#b8b8b6 72%,#ababaa 100%);font-family:Inter,sans-serif}.canvas:before{content:'';position:absolute;inset:0;opacity:.18;background:linear-gradient(118deg,transparent 10%,rgba(255,255,255,.55) 32%,transparent 55%),radial-gradient(circle at 24% 72%,rgba(214,148,189,.32),transparent 25%),radial-gradient(circle at 76% 70%,rgba(117,153,214,.25),transparent 28%)}.topline{position:absolute;z-index:4;top:5%;left:5%;right:5%;display:flex;justify-content:space-between;color:rgba(255,255,255,.62);font-size:10px;letter-spacing:.16em}.title{position:absolute;z-index:3;top:10%;left:0;right:0;margin:0;text-align:center;font-size:clamp(42px,5vw,76px);letter-spacing:-.05em}.frame-wrap{position:absolute;z-index:4;left:50%;top:49%;width:min(760px,66vw);transform:translate(-50%,-50%)}.frame{position:relative;width:100%;aspect-ratio:956/684;overflow:hidden;border:7px solid rgba(255,255,255,.3);border-radius:27px;background:#d0d0ce;box-shadow:0 35px 80px rgba(42,39,48,.28),0 0 0 1px rgba(255,255,255,.8),0 12px 30px rgba(217,116,179,.15)}.crop{position:absolute;inset:0;overflow:hidden}.crop video{position:absolute;left:-6.49%;top:-90.2%;width:112.97%;height:280.7%;max-width:none;object-fit:fill}.glass{position:absolute;z-index:2;inset:0;border-radius:20px;box-shadow:inset 0 1px rgba(255,255,255,.65);pointer-events:none}.controls{position:absolute;z-index:8;left:50%;bottom:-72px;width:min(760px,90%);padding:12px 15px;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;transform:translateX(-50%);border:1px solid rgba(255,255,255,.23);border-radius:14px;color:#ddd;background:rgba(29,29,31,.86);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.25)}.controls button,.controls select{height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#eee;background:#29292c}.controls .play{min-width:82px;color:#151515;background:#f5f4f1;font-weight:700}.timeline{appearance:none;width:100%;height:4px;border-radius:99px;background:linear-gradient(90deg,#cc5f9e var(--progress),#555 var(--progress))}.timeline::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}.time{color:#9c999f;font-size:9px;font-variant-numeric:tabular-nums}.watermark{position:absolute;z-index:3;left:0;right:0;bottom:3%;margin:0;text-align:center;color:rgba(255,255,255,.52);font:700 clamp(35px,5vw,70px) 'Roboto Condensed';letter-spacing:.08em;text-transform:uppercase}.hint{position:absolute;z-index:4;right:4%;bottom:4%;color:rgba(255,255,255,.55);font-size:9px;letter-spacing:.12em}.back{position:absolute;z-index:9;left:4%;bottom:4%;padding:9px 12px;border:1px solid rgba(255,255,255,.25);border-radius:99px;color:#fff;background:rgba(0,0,0,.16);text-decoration:none;font-size:9px}.paused .frame:after{content:'PAUSED';position:absolute;z-index:5;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.8);background:rgba(19,19,21,.13);font-size:10px;letter-spacing:.22em}@media(max-width:750px){.canvas{min-height:690px}.frame-wrap{top:46%;width:92vw}.title{top:12%;font-size:45px}.controls{bottom:-82px;grid-template-columns:auto auto 1fr}.controls select{display:none}.watermark{bottom:10%}.topline{font-size:7px}.hint{display:none}}
</style></head><body><main class="canvas" id="canvas"><div class="topline"><span>THE DESIGN / MOTION REFERENCE</span><span>09 SEC · CONTROLLED PLAYBACK</span></div><h1 class="title">The Design</h1><div class="frame-wrap"><div class="frame"><div class="crop"><video id="motion" autoplay muted loop playsinline preload="auto" src="assets/design-reference.mp4"></video></div><i class="glass"></i></div><div class="controls"><button class="play" id="play">Pause</button><button id="restart">↺ Replay</button><input class="timeline" id="timeline" type="range" min="0" max="9" step="0.01" value="0" style="--progress:0%"><select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select><span class="time" id="time">0.00 / 9.00</span></div></div><p class="watermark">Code with me</p><a class="back" href="index.html">← All studies</a><span class="hint">PLAY · PAUSE · SCRUB · SPEED</span></main><script>
const video=document.querySelector('#motion'),play=document.querySelector('#play'),restart=document.querySelector('#restart'),timeline=document.querySelector('#timeline'),speed=document.querySelector('#speed'),time=document.querySelector('#time'),canvas=document.querySelector('#canvas');const sync=()=>{const d=video.duration||9,p=video.currentTime/d*100;timeline.max=d;timeline.value=video.currentTime;timeline.style.setProperty('--progress',`${p}%`);time.textContent=`${video.currentTime.toFixed(2)} / ${d.toFixed(2)}`};video.ontimeupdate=sync;video.onplay=()=>{play.textContent='Pause';canvas.classList.remove('paused')};video.onpause=()=>{play.textContent='Play';canvas.classList.add('paused')};play.onclick=()=>video.paused?video.play():video.pause();restart.onclick=()=>{video.currentTime=0;video.play()};timeline.oninput=()=>{video.currentTime=Number(timeline.value);sync()};speed.onchange=()=>video.playbackRate=Number(speed.value);document.body.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();play.click()}if(e.key==='ArrowLeft')video.currentTime=Math.max(0,video.currentTime-.25);if(e.key==='ArrowRight')video.currentTime=Math.min(video.duration,video.currentTime+.25)};
</script></body></html>
